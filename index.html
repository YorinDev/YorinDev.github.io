<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forum Java FR</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    color:white;
    overflow:hidden;
}

/* ========================= */
/* Fond holographique animé  */
/* ========================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:linear-gradient(
        120deg,
        #071421,
        #0099ff,
        #704dff,
        #00ffd5,
        #071421
    );
    background-size:400% 400%;
    animation:gradient 15s linear infinite;
    z-index:-2;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.15), transparent 30%),
        radial-gradient(circle at 80% 40%, rgba(255,255,255,.15), transparent 35%),
        radial-gradient(circle at 50% 80%, rgba(255,255,255,.1), transparent 30%);
    animation:float 12s ease-in-out infinite;
    z-index:-1;
}

@keyframes gradient{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

@keyframes float{
    0%{transform:translateY(0);}
    50%{transform:translateY(-25px);}
    100%{transform:translateY(0);}
}

/* ========================= */
/* Titre                     */
/* ========================= */

header{
    margin-top:35px;
    text-align:center;
}

header h1{
    font-size:60px;
    text-shadow:
        0 0 12px cyan,
        0 0 30px cyan;
}

/* ========================= */
/* Navigation                */
/* ========================= */

nav{
    display:flex;
    justify-content:center;
    gap:40px;
    margin-top:60px;
}

nav a{
    color:white;
    text-decoration:none;
    font-size:28px;
    font-weight:bold;

    padding:15px 35px;

    border-radius:12px;

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(10px);

    border:1px solid rgba(255,255,255,.2);

    transition:.25s;
}

nav a:hover{

    transform:translateY(-6px) scale(1.05);

    box-shadow:0 0 25px cyan;

    background:rgba(255,255,255,.18);

}

/* ========================= */
/* Texte                     */
/* ========================= */

.content{

    width:75%;

    margin:80px auto;

    text-align:center;

    font-size:22px;

    line-height:1.7;

}

/* ========================= */
/* Discord                   */
/* ========================= */

.discord{

    position:fixed;

    bottom:25px;

    width:100%;

    text-align:center;

}

.discord a{

    color:#8ab4ff;

    text-decoration:none;

    font-size:22px;

    transition:.2s;

}

.discord a:hover{

    color:white;

    text-shadow:0 0 15px cyan;

}

</style>

</head>
